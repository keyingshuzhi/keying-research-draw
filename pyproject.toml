[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-draw"
version = "0.1.0"
description = "Research plotting CLI for scientific figures and offline maps"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Keying Digital Intelligence" }]
dependencies = [
  "numpy>=1.23,<3.0",
  "matplotlib>=3.7,<4.0",
  "python-dotenv>=1.0,<2.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
data = [
  "pandas>=1.5,<3.0",
  "openpyxl>=3.1,<4.0",
]
stats = [
  "scipy>=1.9,<2.0",
]
ml = [
  "scikit-learn>=1.2,<2.0",
  "scikit-image>=0.22,<1.0",
  "statsmodels>=0.14,<1.0",
  "umap-learn>=0.5,<1.0",
  "upsetplot>=0.8,<1.0",
]
maps = [
  "geopandas>=0.13,<1.0",
  "shapely>=2.0,<3.0",
  "mapclassify>=2.6,<3.0",
  "pyogrio>=0.7,<1.0",
  "fiona>=1.9,<2.0",
]
raster = [
  "rasterio>=1.3,<2.0",
]
web = [
  "fastapi>=0.111,<1.0",
  "uvicorn>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
]
test = [
  "pytest>=8.0,<9.0",
]
all = [
  "pandas>=1.5,<3.0",
  "openpyxl>=3.1,<4.0",
  "scipy>=1.9,<2.0",
  "scikit-learn>=1.2,<2.0",
  "scikit-image>=0.22,<1.0",
  "statsmodels>=0.14,<1.0",
  "umap-learn>=0.5,<1.0",
  "upsetplot>=0.8,<1.0",
  "geopandas>=0.13,<1.0",
  "shapely>=2.0,<3.0",
  "mapclassify>=2.6,<3.0",
  "pyogrio>=0.7,<1.0",
  "fiona>=1.9,<2.0",
  "rasterio>=1.3,<2.0",
  "fastapi>=0.111,<1.0",
  "uvicorn>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pytest>=8.0,<9.0",
]

[project.scripts]
research-draw = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
