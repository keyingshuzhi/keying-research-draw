name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-quality:
    name: Backend Lint/Type/Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -e ".[test]"

      - name: Ruff
        run: python -m ruff check src/main.py src/cli/parser.py src/cli/config_schema.py src/version.py web/backend/app.py tests/test_cli_parser.py tests/test_loaders.py tests/test_smoke_app.py

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        env:
          MPLBACKEND: Agg
          PLOT_BACKEND: Agg
          HEADLESS: "1"
        run: python -m pytest

  frontend-quality:
    name: Frontend Lint/Test/Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Sync frontend version
        run: node scripts/sync-version.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test

      - name: Frontend build
        run: npm run build

  smoke-cli:
    name: CLI Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -e ".[test]"

      - name: Render a smoke figure
        env:
          MPLBACKEND: Agg
          PLOT_BACKEND: Agg
          HEADLESS: "1"
        run: |
          python -m src.main --mode demo --plot box --no-show --outdir /tmp/research-draw-smoke --save-name ci_smoke
          test -f /tmp/research-draw-smoke/ci_smoke.png
